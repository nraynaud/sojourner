<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SVG 2D Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="toolbar">
    <button id="rect-btn">Rectangle</button>
    <button id="ellipse-btn">Ellipse</button>
    <button id="vertex-btn">Vertex</button>
    <button id="select-btn">Select</button>
    <button id="zoom-in-btn">Zoom +</button>
    <button id="zoom-out-btn">Zoom -</button>
    <button id="zoom-reset-btn">Reset Zoom</button>
    <button id="bg-btn">Set Background</button>
    <input type="file" id="bg-input" accept="image/*" style="display: none;">
    <button id="undo-btn">Undo</button>
    <button id="redo-btn">Redo</button>
    <button id="save-btn">Save (Zip)</button>
    <button id="load-btn">Load (Zip)</button>
    <input type="file" id="load-input" accept=".zip" style="display: none;">
    <button id="canny-btn">Canny</button>
    <span id="status">Mode: Rectangle</span>
</div>

<div id="main-container">
    <div id="left-panel">
        <h3 class="panel-header">Entities</h3>
        <div id="entity-list"></div>
    </div>
    <div id="canvas-container">
        <svg id="svg-canvas" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <symbol id="handle-icon" class="ignoreZoom" viewBox="-6 -6 12 12" height="12" width="12" x="-6" y="-6">
                    <rect x="-5" y="-5" width="10" height="10" fill="white" stroke="#007bff" stroke-width="1"/>
                </symbol>
                <symbol id="rotate-handle-icon" class="ignoreZoom" viewBox="-6 -20 12 20" height="32" width="12" x="-6"
                        y="-26">
                    <line stroke="#28a745" stroke-width="1" x1="0" y1="-20" x2="0" y2="0"/>
                    <circle cx="0" cy="-20" r="6" fill="white" stroke="#28a745" stroke-width="1"/>
                </symbol>
                <symbol id="vertex-icon" class="ignoreZoom" viewBox="-4 -4 8 8" height="8" width="8" x="-4" y="-4">
                    <circle cx="0" cy="0" r="3" fill="red"/>
                </symbol>
            </defs>
            <g id="zoom-group">
                <g id="background-group"></g>
                <g id="shapes-group"></g>
                <g id="handles-group" style="visibility: hidden;">
                    <use class="rotate-handle" x="0" y="0" href="#rotate-handle-icon"/>
                    <!-- Resize handles -->
                    <use class="handle " data-dir="nw" x="0" y="0" href="#handle-icon"/>
                    <use class="handle " data-dir="n" x="0" y="0" href="#handle-icon"/>
                    <use class="handle " data-dir="ne" x="0" y="0" href="#handle-icon"/>
                    <use class="handle " data-dir="e" x="0" y="0" href="#handle-icon"/>
                    <use class="handle " data-dir="se" x="0" y="0" href="#handle-icon"/>
                    <use class="handle " data-dir="s" x="0" y="0" href="#handle-icon"/>
                    <use class="handle " data-dir="sw" x="0" y="0" href="#handle-icon"/>
                    <use class="handle " data-dir="w" x="0" y="0" href="#handle-icon"/>
                    <!-- Ellipse curve handles -->
                    <use class="ellipse-handle" data-ellipse-dir="n" x="0" y="0" href="#handle-icon"/>
                    <use class="ellipse-handle" data-ellipse-dir="e" x="0" y="0" href="#handle-icon"/>
                    <use class="ellipse-handle" data-ellipse-dir="s" x="0" y="0" href="#handle-icon"/>
                    <use class="ellipse-handle" data-ellipse-dir="w" x="0" y="0" href="#handle-icon"/>
                </g>
            </g>
        </svg>
    </div>
</div>
<script>
  // indexedDB
  const dbName = 'SvgEditorDB', dbStoreName = 'state'
  let dbInstance = null

  const dbRequest = async req => new Promise((resolve, reject) => {
    req.onsuccess = () => resolve(req.result)
    req.onerror = () => reject(req.error)
  })

  const dbGetObjStore = async (mode = 'readonly') => (await openDb()).transaction(dbStoreName, mode).objectStore(dbStoreName)
  const dbGet = async key => dbRequest((await dbGetObjStore()).get(key))
  const dbSet = async (key, val) => dbRequest((await dbGetObjStore('readwrite')).put(val, key))

  async function openDb () {
    if (dbInstance) return dbInstance
    const req = indexedDB.open(dbName, 1)
    req.onupgradeneeded = (e) => e.target.result.createObjectStore(dbStoreName)
    return dbInstance = await dbRequest(req)
  }
</script>
<script>
  // utils
  const $ = id => document.getElementById(id)
  const createNS = tag => document.createElementNS('http://www.w3.org/2000/svg', tag)
  const setAttributes =
    (element, attributes) => Object.entries(attributes).forEach(([key, value]) => element.setAttribute(key, value))
  const mapObject =
    (obj, mapper) => Object.fromEntries(Object.entries(obj).map(([key, value]) => mapper(key, value)))
  const invokeLater = work => setTimeout(work, 0)
  const dispatchCustom = (target, evtName, det) => target.dispatchEvent(new CustomEvent(evtName, {detail: det}))

  function getMousePos (evt, svg) {
    const c = svg.getScreenCTM()
    return {x: (evt.clientX - c.e) / c.a, y: (evt.clientY - c.f) / c.d}
  }
</script>
<script type="module">
  import * as modes from './modes.mjs'
  import * as shapes from './shapes.mjs'
  import Canny from './canny.mjs'

  export class ReconstructionDocument extends EventTarget {
    constructor (window) {
      super()
      Object.assign(this, {
        entities: [],
        entityCount: 0,
        entityItemsMap: new Map(),
        backgroundGroup: $('background-group'),
        shapesGroup: $('shapes-group'),
        entityList: $('entity-list'),
        svg: $('svg-canvas'),
        undoStack: [],
        redoStack: [],
        window
      })
    }

    pushState () {
      this.undoStack.push(this.getState())
      this.redoStack = []
      if (this.undoStack.length > 50) this.undoStack.shift()
    }

    getState () {
      return {
        entities: this.entities.map(s => s.toJSON()),
        entityCount: this.entityCount,
        backgroundImage: this.backgroundImage,
        backgroundName: this.backgroundName
      }
    }

    undo () {
      if (this.undoStack.length === 0) return
      this.redoStack.push(this.getState())
      this._applyData(this.undoStack.pop())
      this.dispatchEvent(new CustomEvent('stateChanged'))
    }

    redo () {
      if (this.redoStack.length === 0) return
      this.undoStack.push(this.getState())
      this._applyData(this.redoStack.pop())
      this.dispatchEvent(new CustomEvent('stateChanged'))
    }

    setBackground (blob, name, skipSave = false) {
      if (!skipSave) this.pushState()
      if (this.bgObjectURL) URL.revokeObjectURL(this.bgObjectURL)
      if (this.cannyObjectURL) URL.revokeObjectURL(this.cannyObjectURL)
      Object.assign(this, {backgroundImage: blob, backgroundName: name, cannyEnabled: false})
      this.cannyObjectURL = null
      this.backgroundGroup.innerHTML = ''
      if (blob) {
        this.bgObjectURL = URL.createObjectURL(blob)
        this._updateBackgroundImage()
      }
      else {
        this.svg.removeAttribute('width')
        this.svg.removeAttribute('height')
      }
      this.updateBgListItem()
      if (!skipSave) this.save()
    }

    getBackgroundSize () {
      const el = $('backgroundImage')
      if (!el) return {w: 1000, h: 1000} // Default size if no background is set
      return {w: el.width.baseVal.value, h: el.height.baseVal.value}
    }

    async toggleCanny () {
      if (!this.backgroundImage) return
      this.cannyEnabled = !this.cannyEnabled
      let $canny = $('canny-btn')
      if (this.cannyEnabled && !this.cannyObjectURL) {
        if (this.cannyProcessing) return
        this.cannyProcessing = true
        $canny.textContent = 'Canny (Processing...)'
        try {
          console.time('canny processing including worker overhead')
          const cannyBlob = await Canny.processAsync(this.bgObjectURL)
          this.cannyObjectURL = URL.createObjectURL(cannyBlob)
          console.timeEnd('canny processing including worker overhead')
        } catch (e) {
          console.error('Canny processing failed:', e)
          this.cannyEnabled = false
        } finally {
          this.cannyProcessing = false
          $canny.textContent = 'Canny'
        }
      }
      this._updateBackgroundImage()
      $canny.classList.toggle('active', this.cannyEnabled)
    }

    _updateBackgroundImage () {
      this.backgroundGroup.innerHTML = ''
      const img = createNS('image'), tempImg = new Image()
      const url = this.cannyEnabled ? this.cannyObjectURL : this.bgObjectURL
      setAttributes(img, {href: url, id: 'backgroundImage'})
      tempImg.onload = () => {
        const zoom = this.getCurrentZoom()
        setAttributes(img, {width: tempImg.naturalWidth, height: tempImg.naturalHeight})
        setAttributes(this.svg, {width: tempImg.naturalWidth * zoom, height: tempImg.naturalHeight * zoom})
      }
      tempImg.src = url
      this.backgroundGroup.appendChild(img)
    }

    getCurrentZoom () {
      return getCurrentZoom()
    }

    updateBgListItem () {
      if (!this.backgroundName) {
        if (this.bgListItem) {
          this.bgListItem.remove()
          this.bgListItem = null
        }
        return
      }
      if (!this.bgListItem) {
        this.bgListItem = document.createElement('div')
        this.bgListItem.className = 'entity-item'
        this.bgListItem.style.cssText = 'background:#f0f0f0; border-style:dashed'
        this.bgListItem.innerHTML = '<div class="name-label"></div><div class="delete-btn">×</div>'
        this.bgListItem.querySelector('.delete-btn').onclick = (e) => {
          e.stopPropagation()
          this.setBackground(null, null)
        }
        this.entityList.prepend(this.bgListItem)
      }
      this.bgListItem.querySelector('.name-label').textContent = `Background: ${this.backgroundName}`
    }

    addShape (shape, skipSave = false) {
      if (!skipSave) this.pushState()
      this.entities.push(shape)
      this.addEntityItem(shape)
      shape.el.addEventListener('click', (e) => {
        e.stopPropagation()
        this.dispatchEvent(new CustomEvent('canvasShapeClick', {detail: {shape}}))
      })
      if (!skipSave) this.save()
    }

    addEntityItem (shape) {
      const id = shape.id, item = document.createElement('div')
      item.className = 'entity-item'
      item.setAttribute('data-id', id)
      item.innerHTML = `<div class="name-label">${shape.name || id}</div><input id="entity-name-${id}" type="text" value="${shape.name || id}"><div class="delete-btn">×</div>`
      item.onclick = (e) => {
        e.stopPropagation()
        this.dispatchEvent(new CustomEvent('sidebarShapeClick', {detail: {shape}}))
      }
      const label = item.querySelector('.name-label'), input = item.querySelector('input'),
        del = item.querySelector('.delete-btn')
      del.onclick = (e) => {
        e.stopPropagation()
        this.removeShape(shape)
      }
      const finish = () => {
        const newName = input.value.trim() || id
        if (newName !== (shape.name || id)) {
          this.pushState()
          shape.name = label.textContent = newName
          item.classList.remove('editing')
          this.save()
        }
        else {
          item.classList.remove('editing')
        }
      }
      input.onkeydown = (e) => {
        if (e.key === 'Enter') finish()
        if (e.key === 'Escape') {
          input.value = shape.name || id
          item.classList.remove('editing')
        }
      }
      input.onblur = finish
      input.onmousedown = (e) => e.stopPropagation()
      item.ondblclick = (e) => {
        e.stopPropagation()
        item.classList.add('editing')
        input.focus()
        input.select()
      }
      this.entityList.appendChild(item)
      this.entityItemsMap.set(shape, item)
    }

    updateSelection (sel) {
      this.entityItemsMap.forEach((item, s) => {
        item.classList.toggle('selected', s === sel)
        if (s === sel) item.scrollIntoView({behavior: 'smooth', block: 'nearest'})
      })
    }

    removeShape (shape) {
      this.pushState()
      this.entities = this.entities.filter(s => s !== shape)
      const item = this.entityItemsMap.get(shape)
      if (item) {
        item.remove()
        this.entityItemsMap.delete(shape)
      }
      if (shape.el && shape.el.parentNode) shape.el.remove()
      dispatchCustom(this, 'deleteShape', {shape})
      this.save()
    }

    async save () {
      const data = {
        entities: this.entities.map(s => s.toJSON()),
        entityCount: this.entityCount,
        backgroundImage: this.backgroundImage,
        backgroundName: this.backgroundName
      }
      try {
        await dbSet('svg-editor-doc', data)
      } catch (e) { console.error('Save to IndexedDB failed:', e) }
    }

    async saveToFile () {
      const z = new JSZip(), d = {
        entities: this.entities.map(s => s.toJSON()),
        entityCount: this.entityCount,
        backgroundName: this.backgroundName
      }
      z.file('document.json', JSON.stringify(d))
      if (this.backgroundImage instanceof Blob) {
        z.file(this.backgroundName || 'background', this.backgroundImage)
      }
      const b = await z.generateAsync({type: 'blob'}), u = URL.createObjectURL(b), a = document.createElement('a')
      a.href = u
      a.download = 'project.zip'
      a.click()
      URL.revokeObjectURL(u)
    }

    async loadFromFile (f) {
      const z = await JSZip.loadAsync(f), jf = z.file('document.json')
      if (!jf) return
      const d = JSON.parse(await jf.async('string'))
      if (d.backgroundName) {
        const bf = z.file(d.backgroundName)
        if (bf) d.backgroundImage = await bf.async('blob')
      }
      this._applyData(d)
      activeMode.transitionToSelect()
    }

    async loadFromDB () {
      const d = await dbGet('svg-editor-doc')
      if (d) this._applyData(d)
    }

    _applyData (d) {
      Object.assign(this, {
        entities: [],
        entityCount: d.entityCount || 0,
        bgListItem: null
      })
      this.shapesGroup.innerHTML = this.entityList.innerHTML = ''
      this.entityItemsMap.clear()
      if (d.backgroundImage) this.setBackground(d.backgroundImage, d.backgroundName, true)
      else {
        this.backgroundImage = null
        this.backgroundName = null
        this.backgroundGroup.innerHTML = ''
        this.svg.removeAttribute('width')
        this.svg.removeAttribute('height')
      }
      if (d.entities) d.entities.forEach(ent => {
        let s
        if (ent.type === 'rect') s = new shapes.RectangleShape(ent.id, null, 0)
        else if (ent.type === 'ellipse') s = new shapes.EllipseShape(ent.id, null, 0)
        else if (ent.type === 'vertex') s = new shapes.VertexShape(ent.id, null, 0, this.getCurrentZoom())
        else return
        s.name = ent.name
        if (ent.transform) s.setAttributes({transform: ent.transform})
        s.setAttributes(ent.attributes)
        this.shapesGroup.appendChild(s.el)
        this.addShape(s, true)
      })
      this.save()
    }
  }

  class ActiveModeHolder extends EventTarget {
    activeMode = null

    constructor (doc, $svg) {
      super()
      this.doc = doc
      this.$svg = $svg
      this.setMode(modes.SelectionIdleMode)
    }

    setMode (ModeClass, arg) {
      if (this.activeMode) this.activeMode.deactivate()
      this.activeMode = new ModeClass(this.doc, this.$svg, $zoomGroup, arg)
      this.activeMode.addEventListener('modeTransition', e => {
        console.log('modeTransition', e)
        invokeLater(() => {this.setMode(e.detail.newMode, e.detail.arg)})
      }, {once: true})
      if (this.activeMode) {
        this.activeMode.activate(this)
      }
    }

    transitionToSelect (el) {
      if (el) dispatchCustom(this.activeMode, 'modeTransition', {newMode: modes.SelectionActiveMode, arg: el})
      else dispatchCustom(this.activeMode, 'modeTransition', {newMode: modes.SelectionIdleMode})
    }
  }

  console.log('Script loaded')
  let doc = new ReconstructionDocument(window)
  let $svg = $('svg-canvas')
  let $zoomGroup = $('zoom-group')
  let $viewport = $('canvas-container')
  let activeMode = new ActiveModeHolder(doc, $svg)

  doc.loadFromDB().then(async () => {
    if (!doc.backgroundImage) {
      const blob = await (await fetch('images/default-bg.jpg')).blob()
      doc.setBackground(blob, 'default-bg.jpg')
    }
    window.addEventListener('beforeunload', () => doc.save())
  })
  $viewport.addEventListener('wheel', e => {
    if (e.ctrlKey) {
      e.preventDefault()
      zoom(e.deltaY < 0 ? 1.05 : 0.95, getMousePos(e, $zoomGroup))
    }
  }, {passive: false})

  window.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
      e.preventDefault()
      if (e.shiftKey) doc.redo()
      else doc.undo()
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
      e.preventDefault()
      doc.redo()
    }
  })

  export function getCurrentZoom () {
    return parseFloat($zoomGroup.style.scale) || 1
  }

  export function zoom (factor, center) {
    let currentZoom = getCurrentZoom()
    let postZoom = null
    let newZoom = currentZoom * factor
    const {w, h} = doc.getBackgroundSize()
    if (factor === 0) {
      newZoom = 1
    }
    else {
      const rect = $viewport.getBoundingClientRect()
      let minZoom
      minZoom = Math.min(rect.width / w, rect.height / h)
      newZoom = Math.max(minZoom, newZoom)
      if (center) {
        postZoom = () => {
          $viewport.scrollLeft += center.x * (newZoom - currentZoom)
          $viewport.scrollTop += center.y * (newZoom - currentZoom)
        }
      }
    }
    if (newZoom === currentZoom)
      return
    $zoomGroup.style.scale = `${newZoom}`
    $svg.style.setProperty('--zoom-level', `${newZoom}`)
    setAttributes($svg, {width: newZoom * w, height: newZoom * h})
    if (postZoom)
      postZoom()
    doc.dispatchEvent(new CustomEvent('zoomed', {detail: newZoom}))
  }

  function handleBgChange (e) {
    const f = e.target.files[0]
    if (f) doc.setBackground(f, f.name)
  }

  async function handleLoadFile (e) {
    const f = e.target.files[0]
    if (f) await doc.loadFromFile(f)
    e.target.value = ''
  }

  function toggleCanny () {
    doc.toggleCanny()
  }

  const clickHandlers = {
    'rect-btn': () => activeMode.setMode(modes.DrawRectangleMode),
    'ellipse-btn': () => activeMode.setMode(modes.DrawEllipseMode),
    'vertex-btn': () => activeMode.setMode(modes.DrawVertexMode),
    'select-btn': () => activeMode.setMode(modes.SelectionIdleMode),
    'zoom-in-btn': () => zoom(1.1),
    'zoom-out-btn': () => zoom(0.9),
    'zoom-reset-btn': () => zoom(0),
    'bg-btn': () => $('bg-input').click(),
    'undo-btn': () => doc.undo(),
    'redo-btn': () => doc.redo(),
    'save-btn': () => doc.saveToFile(),
    'load-btn': () => $('load-input').click(),
    'canny-btn': toggleCanny,
  }
  for (const [id, handler] of Object.entries(clickHandlers)) {
    $(id).addEventListener('click', handler)
  }
  const changeHandlers = {
    'bg-input': handleBgChange,
    'load-input': handleLoadFile
  }
  for (const [id, handler] of Object.entries(changeHandlers)) {
    $(id).addEventListener('change', handler)
  }
</script>
</body>
</html>
