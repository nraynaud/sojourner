<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SVG 2D Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="toolbar">
    <button id="rect-btn">Quadrilateral</button>
    <button id="ellipse-btn">Ellipse</button>
    <button id="direction-btn">Direction</button>
    <button id="vertex-btn">Vertex</button>
    <button id="select-btn">Select</button>
    <button id="zoom-in-btn">Zoom +</button>
    <button id="zoom-out-btn">Zoom -</button>
    <button id="zoom-reset-btn">Reset Zoom</button>
    <button id="bg-btn">Add Image</button>
    <input type="file" id="bg-input" accept="image/*" style="display: none;">
    <button id="undo-btn">Undo</button>
    <button id="redo-btn">Redo</button>
    <button id="save-btn">Save (Zip)</button>
    <button id="load-btn">Load (Zip)</button>
    <input type="file" id="load-input" accept=".zip" style="display: none;">
    <button id="canny-btn">Canny</button>
    <button id="solve-btn">Solve</button>
</div>

<div id="main-container">
    <div id="left-panel">
        <h3 class="panel-header">Images</h3>
        <div id="image-list"></div>
        <h3 class="panel-header">Entities</h3>
        <div id="entity-list"></div>
        <div id="details-panel" style="display: none;">
            <h3 class="panel-header">Details</h3>
            <div id="details-content"></div>
        </div>
    </div>
    <div id="canvas-container">
        <svg id="svg-canvas" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <symbol id="handle-icon" class="ignoreZoom" viewBox="-6 -6 12 12" height="12" width="12" x="-6" y="-6">
                    <rect x="-5" y="-5" width="10" height="10" fill="white" stroke="#007bff" stroke-width="1"/>
                </symbol>
                <symbol id="rotate-handle-icon" class="ignoreZoom" viewBox="-6 -20 12 20" height="32" width="12" x="-6"
                        y="-26">
                    <line stroke="#28a745" stroke-width="1" x1="0" y1="-20" x2="0" y2="0"/>
                    <circle cx="0" cy="-20" r="6" fill="white" stroke="#28a745" stroke-width="1"/>
                </symbol>
                <symbol id="vertex-icon" class="ignoreZoom" viewBox="-6 -6 12 12" height="12" width="12" x="-6" y="-6">
                    <circle cx="0" cy="0" r="4"/>
                </symbol>
                <symbol id="direction-handle-icon" class="ignoreZoom" viewBox="-6 -6 12 12" height="12" width="12"
                        x="-6" y="-6">
                    <circle cx="0" cy="0" r="5" fill="white" stroke="#007bff" stroke-width="1"/>
                </symbol>
            </defs>
            <g id="zoom-group">
                <g id="background-group"></g>
                <g id="shapes-group"></g>
                <use id="hover-overlay" href="" pointer-events="none"></use>
                <g id="quad-handles-group" style="visibility: hidden;">
                    <!-- Resize handles -->
                    <use class="handle " data-dir="nw" x="0" y="0" href="#handle-icon"/>
                    <use class="handle " data-dir="ne" x="0" y="0" href="#handle-icon"/>
                    <use class="handle " data-dir="se" x="0" y="0" href="#handle-icon"/>
                    <use class="handle " data-dir="sw" x="0" y="0" href="#handle-icon"/>
                </g>
                <g id="ellipse-handles-group" style="visibility: hidden;">
                    <!-- Ellipse curve handles -->
                    <use class="ellipse-handle" data-ellipse-dir="n" x="0" y="0" href="#handle-icon"/>
                    <use class="ellipse-handle" data-ellipse-dir="e" x="0" y="0" href="#handle-icon"/>
                    <use class="ellipse-handle" data-ellipse-dir="s" x="0" y="0" href="#handle-icon"/>
                    <use class="ellipse-handle" data-ellipse-dir="w" x="0" y="0" href="#handle-icon"/>
                </g>
                <g id="direction-handles-group" style="visibility: hidden;">
                    <use class="handle" data-dir="start" x="0" y="0" href="#direction-handle-icon"/>
                    <use class="handle" data-dir="end" x="0" y="0" href="#direction-handle-icon"/>
                </g>
            </g>
        </svg>
    </div>
</div>

<div id="status-bar">
    <div id="status-mode">Mode: Rectangle</div>
    <div id="status-actions"></div>
</div>
<script type="module">
  import { ReconstructionDocument } from './src/document.mjs'
  import { DetailsPanel } from './src/details.mjs'
  import * as modes from './src/modes.mjs'
  import { DirectionShape, VertexShape } from './src/shapes.mjs'
  import * as shapes from './src/shapes.mjs'
  import runCeres from './ceres/ceres.mjs'
  import {
    $,
    invokeLater,
    dispatchCustom,
  } from './src/util.mjs'

  class ActiveModeHolder extends EventTarget {
    activeMode = null

    constructor (doc, $svg, $zoomGroup) {
      super()
      this.doc = doc
      this.$svg = $svg
      this.$zoomGroup = $zoomGroup
      this.setMode(modes.SelectionIdleMode)
    }

    setMode (ModeClass, arg) {
      if (this.activeMode) this.activeMode.deactivate()
      this.activeMode = new ModeClass(this.doc, this.$svg, this.$zoomGroup, arg)
      this.activeMode.addEventListener('modeTransition', e => {
        console.log('modeTransition', e)
        invokeLater(() => {this.setMode(e.detail.newMode, e.detail.arg)})
      }, {once: true})
      if (this.activeMode) {
        this.activeMode.activate(this)
      }
    }

    transitionToSelect (el) {
      if (el) {
        let ModeClass = modes.SelectionQuadrilateralMode
        if (el instanceof shapes.EllipseShape) ModeClass = modes.SelectionEllipseMode
        if (el instanceof shapes.VertexShape) ModeClass = modes.SelectionVertexMode
        if (el instanceof shapes.DirectionShape) ModeClass = modes.SelectionDirectionMode
        dispatchCustom(this.activeMode, 'modeTransition', {newMode: ModeClass, arg: el})
      }
      else dispatchCustom(this.activeMode, 'modeTransition', {newMode: modes.SelectionIdleMode})
    }

    handleDrop (id, pos) {
      const shape = this.doc.entities.find(s => s.id === id)
      if (!shape) return
      if (!this.doc.currentImageId) return
      if (!shape.geometries[this.doc.currentImageId]) {
        this.doc.pushState()
        shape.geometries[this.doc.currentImageId] = shape.createDefaultGeometry(pos)
        this.doc.save()
        this.doc._updateShapesVisibility()
      }
      this.transitionToSelect(shape)
    }
  }

  class UIObject {
    constructor () {
    }

    getCurrentZoom () {
      return parseFloat($svg.style.getPropertyValue('--zoom-level')) || 1
    }

    zoom (factor, center) {
      let currentZoom = this.getCurrentZoom()
      let newZoom = currentZoom * factor
      if (factor === 0) {
        newZoom = 1
      }
      else {
        const {w, h} = doc.getBackgroundSize()
        const rect = $viewport.getBoundingClientRect()
        let minZoom = Math.min(rect.width / w, rect.height / h)
        newZoom = Math.max(minZoom, newZoom)
      }
      if (newZoom === currentZoom)
        return
      $svg.style.setProperty('--zoom-level', '' + newZoom)
      if (center) {
        $viewport.scrollLeft += center.x * (newZoom - currentZoom)
        $viewport.scrollTop += center.y * (newZoom - currentZoom)
      }
      doc.dispatchEvent(new CustomEvent('zoomed', {detail: newZoom}))
    }

    highlightShape (shapeId) {
      const hoverOverlay = $('hover-overlay')
      if (shapeId) {
        hoverOverlay.setAttribute('href', `#${shapeId}`)
        hoverOverlay.style.display = 'inherit'
      }
      else {
        hoverOverlay.style.display = 'none'
      }
    }
  }

  console.log('Script loaded')
  const ui = new UIObject()
  let doc = new ReconstructionDocument(ui)
  const detailsPanel = new DetailsPanel($('details-panel'), $('details-content'))
  let $svg = $('svg-canvas')
  let $zoomGroup = $('zoom-group')
  let $viewport = $('canvas-container')
  let activeMode = new ActiveModeHolder(doc, $svg, $zoomGroup)

  doc.addEventListener('selectionChanged', e => {
    detailsPanel.setShape(e.detail.selected)
  })

  doc.loadFromDB().then(async () => {
    if (doc.images.length === 0) {
      const blob = await (await fetch('images/default-bg.jpg')).blob()
      await doc.addImage(blob, 'default-bg.jpg')
    }
    window.addEventListener('beforeunload', () => doc.save())
  })
  $viewport.addEventListener('wheel', e => {
    if (e.ctrlKey) {
      e.preventDefault()
      ui.zoom(e.deltaY < 0 ? 1.05 : 0.95, modes.getMousePos(e, $zoomGroup))
    }
  }, {passive: false})

  $svg.addEventListener('dragover', e => {
    e.preventDefault()
    e.dataTransfer.dropEffect = 'copy'
  })

  $svg.addEventListener('drop', e => {
    e.preventDefault()
    const id = e.dataTransfer.getData('text/plain')
    const pos = modes.getMousePos(e, $zoomGroup)
    activeMode.handleDrop(id, pos)
  })

  window.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
      e.preventDefault()
      if (e.shiftKey) doc.redo()
      else doc.undo()
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
      e.preventDefault()
      doc.redo()
    }
  })

  function handleBgChange (e) {
    for (const f of e.target.files) {
      doc.addImage(f, f.name)
    }
    e.target.value = ''
  }

  async function handleLoadFile (e) {
    const f = e.target.files[0]
    if (f) await doc.loadFromFile(f)
    e.target.value = ''
  }

  function toggleCanny () {
    doc.toggleCanny()
  }

  function solve () {
    const vertices = doc.entities.filter(e => e instanceof VertexShape)
    const collectedVertices = []
    console.log('vertices', vertices)
    for (const vertex of vertices) {
      collectedVertices.push([...Object.values(vertex.attributes), ...Object.values(vertex.get2DAttributes())])
    }
    console.log('collectedVertices', collectedVertices)
    const directions = doc.entities.filter(e => e instanceof DirectionShape)
    const byDirection = Object.groupBy(directions, direction => JSON.stringify(direction.attributes))
    for (const key in byDirection) {
      byDirection[key] = byDirection[key].map(dir => dir.get2DAttributes())
    }
    console.log('byDirection', byDirection)
    runCeres([8688, 5792], collectedVertices, byDirection)
  }

  const clickHandlers = {
    'rect-btn': () => activeMode.setMode(modes.DrawQuadrilateralMode),
    'ellipse-btn': () => activeMode.setMode(modes.DrawEllipseMode),
    'direction-btn': () => activeMode.setMode(modes.DrawDirectionMode),
    'vertex-btn': () => activeMode.setMode(modes.DrawVertexMode),
    'select-btn': () => activeMode.setMode(modes.SelectionIdleMode),
    'zoom-in-btn': () => ui.zoom(1.1),
    'zoom-out-btn': () => ui.zoom(0.9),
    'zoom-reset-btn': () => ui.zoom(0),
    'bg-btn': () => {
      const input = $('bg-input')
      input.multiple = true
      input.click()
    },
    'undo-btn': () => doc.undo(),
    'redo-btn': () => doc.redo(),
    'save-btn': () => doc.saveToFile(),
    'load-btn': () => $('load-input').click(),
    'canny-btn': toggleCanny,
    'solve-btn': solve
  }
  for (const [id, handler] of Object.entries(clickHandlers)) {
    $(id).addEventListener('click', handler)
  }
  const changeHandlers = {
    'bg-input': handleBgChange,
    'load-input': handleLoadFile
  }
  for (const [id, handler] of Object.entries(changeHandlers)) {
    $(id).addEventListener('change', handler)
  }
</script>
</body>
</html>
